name: Content Monitoring

on:
  schedule:
    # Run daily at 11:00 AM UTC
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
      - name: Generate monitoring report
        run: |
          cat > monitoring_report.md << 'EOF'
          # Content Production Report
          
          Generated: $(date)
          
          ## Videos Created
          - Total: $(find output/videos -name "*.json" | wc -l)
          - Location: output/videos/
          
          ## Topics Covered
          - Personal Finance
          - Investment Strategies
          - Retirement Planning
          - Real Estate Investing
          - Debt Management
          - Passive Income
          
          ## System Status
          - Multi-agent pipeline: Active
          - Daily automation: Scheduled
          - Total cost: $0 (Free tier)
          
          ## Next Steps
          - Create video files from scripts
          - Upload to YouTube
          - Monitor performance metrics
          EOF
          
          cat monitoring_report.md
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: monitoring_report.md
          retention-days: 30
