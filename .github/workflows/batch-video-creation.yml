name: Batch Video Creation

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of videos to create'
        required: true
        default: '5'
        type: number

jobs:
  batch-create:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dateutil

      - name: Ensure config file exists
        run: |
          mkdir -p config
          if [ ! -f config/config.yaml ]; then
            echo "Config file not found, creating from config/config.yaml"
          fi
      - name: Create batch of videos
        run: |
         cd scripts
          python3 orchestrator.py --batch ${{ github.event.inputs.batch_size }}
        env:
          CONFIG_PATH: config/config.yaml
      
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: batch-videos
          path: output/videos/*.json
          retention-days: 30
