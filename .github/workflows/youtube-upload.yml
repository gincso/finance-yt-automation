name: YouTube Upload

on:
  schedule:
    # Run daily at 10:00 AM UTC (after video creation)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  upload-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install YouTube API client
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
      
      - name: Create upload script
        run: |
          cd scripts
          python3 create_upload_script.py
      
      - name: Set YouTube API Key
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> $GITHUB_ENV
      
      - name: Upload to YouTube
        run: |
          cd scripts
          python3 upload_youtube.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
